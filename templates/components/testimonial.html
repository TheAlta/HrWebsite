{% load wagtailimages_tags %}
{# Usage: {% include "components/testimonial.html" with testimonial=t %} #}
<figure class="card">
  <div class="card-body gap-4">
    {% include "components/icon.html" with name="quote" size="28" class="text-accent" %}
    <blockquote class="text-[0.98rem] leading-8 text-ink-2">«{{ testimonial.quote }}»</blockquote>
    <figcaption class="mt-auto flex items-center gap-3 border-t border-line pt-4">
      {% if testimonial.photo %}{% image testimonial.photo fill-96x96 format-webp class="size-11 rounded-full object-cover" loading="lazy" alt="" %}{% else %}<span class="icon-disc size-11 font-display text-lg font-semibold" aria-hidden="true">{{ testimonial.author_name|first }}</span>{% endif %}
      <div>
        <p class="font-semibold text-ink">{{ testimonial.author_name }}</p>
        <p class="muted">{{ testimonial.author_title }}{% if testimonial.client %}{% if testimonial.author_title %}، {% endif %}{{ testimonial.client.name }}{% endif %}</p>
      </div>
    </figcaption>
  </div>
</figure>
