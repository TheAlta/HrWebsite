{% extends "wagtailadmin/generic/base.html" %}

{% block main_content %}
  {% if warning %}<p class="help-block help-warning">{{ warning }}</p>{% endif %}
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
      {% include "wagtailadmin/shared/field.html" with field=field %}
    {% endfor %}
    <p class="w-mt-6">
      <button type="submit" class="button">{{ submit_label }}</button>
      <a href="{{ cancel_url }}" class="button button-secondary">انصراف</a>
    </p>
  </form>
{% endblock %}
