{# Approve and reject in the comment's own row (apps/content/wagtail_hooks.py) #}
<td>
  {% if instance.status != "approved" %}
  <form method="post" action="{% url 'comments:set_status' instance.pk 'approve' %}" style="display:inline">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" class="button button-small">تأیید</button></form>
  {% endif %}
  {% if instance.status != "spam" %}
  <form method="post" action="{% url 'comments:set_status' instance.pk 'spam' %}" style="display:inline">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" class="button button-small button-secondary no">رد</button></form>
  {% endif %}
</td>
