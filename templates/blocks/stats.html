{# The demo's stat band: large numbers in white on a slowly moving navy-to-gold gradient #}
<section class="section">
  <div class="container-page">
    <div class="statband">
      {% if value.title %}<h2 class="relative z-10 mb-6 text-center text-xl font-bold text-white">{{ value.title }}</h2>{% endif %}
      <dl class="relative z-10 grid grid-cols-2 gap-x-4 gap-y-7 text-center lg:grid-cols-4">
        {% for item in value.items %}
        <div class="flex flex-col-reverse gap-1">
          <dt class="text-sm">{{ item.label }}</dt>
          <dd><b class="statband-number">{{ item.value }}</b></dd>
        </div>
        {% endfor %}
      </dl>
    </div>
  </div>
</section>
