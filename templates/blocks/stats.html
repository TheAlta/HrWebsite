<section class="pt-4 pb-14 sm:pb-20">
  <div class="container-page">
    {% if value.title %}<h2 class="heading-2 mb-6">{{ value.title }}</h2>{% endif %}
    <dl class="grid grid-cols-2 gap-4 lg:grid-cols-4">
      {% for item in value.items %}
      <div class="tile stat-tile flex-col-reverse">
        <dt class="text-sm text-ink-3">{{ item.label }}</dt>
        <dd><b>{{ item.value }}</b></dd>
      </div>
      {% endfor %}
    </dl>
  </div>
</section>
