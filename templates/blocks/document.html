{% load core_tags %}
<a href="{{ value.document.url }}" class="my-4 flex items-center gap-3 rounded-(--radius-control) border border-line bg-surface px-4 py-3 hover:border-accent hover:bg-accent-soft">
  {% include "components/icon.html" with name="download" class="text-accent-ink" %}
  <span class="font-medium text-ink">{% firstof value.title value.document.title %}</span>
  <span class="muted ms-auto uppercase">{{ value.document.file_extension }}</span>
</a>
