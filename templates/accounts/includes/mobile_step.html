<form method="post" action="{% url 'accounts:login' %}" hx-post="{% url 'accounts:login' %}" hx-target="#login-card" class="card-body gap-4" novalidate>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <div>
    <h1 class="text-xl font-extrabold text-slate-900">ورود یا ثبت‌نام</h1>
    <p class="muted mt-1">کد تأیید به شماره شما پیامک می‌شود.</p>
  </div>
  {% if error %}{% include "components/alert.html" with level="error" text=error %}{% endif %}
  {% with field=form.mobile %}{% include "components/field.html" %}{% endwith %}
  <button type="submit" class="btn btn-primary w-full">دریافت کد</button>
</form>
