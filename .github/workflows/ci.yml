name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.17.2"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrweb
          POSTGRES_USER: hrweb
          POSTGRES_PASSWORD: hrweb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrweb" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://hrweb:hrweb@localhost:5432/hrweb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --create-db --cov --cov-report=term

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --target prod --build-arg PIP_INDEX_URL=https://pypi.org/simple -t hrweb:ci .
